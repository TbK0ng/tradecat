[project]
name = "tradecat-agent"
version = "0.1.3"
description = "Autonomous Agent trading loop public-readonly and paper/watch runtime for TradeCat signals"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "TradeCat Team" }]
keywords = ["tradecat", "agent", "paper-trading", "public-readonly"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "urllib3>=2.8.0",
]

[project.optional-dependencies]
dev = [
    "jsonschema>=4.22.0",
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]
report = [
    "Jinja2>=3.1.4,<4",
    "pandas>=2.2.3,<3",
    "plotly>=6.0.0,<7",
]
research = [
    "optuna>=4.3.0,<5",
    "quantstats>=0.0.81,<0.1",
    "vectorbt>=0.28.5,<0.29",
]

[project.scripts]
tradecat-auto = "tradecat_auto.cli:main"
tradecat-agent = "tradecat_auto.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [".github/src/tradecat_sources", ".github/src/tradecat_auto"]

[tool.ruff]
target-version = "py312"
line-length = 120
src = [".github/src", ".github/tests"]
cache-dir = ".github/.ruff_cache"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = [".github/tests"]
pythonpath = [".github/src"]
cache_dir = ".github/.pytest_cache"
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = ["-q"]
