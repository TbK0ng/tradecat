name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Skill strict
        run: bash .github/scripts/validate-skill.sh --strict
      - name: Secret scan
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git fetch origin "${{ github.base_ref }}" --depth=1
            log_opts="origin/${{ github.base_ref }}..HEAD"
          elif [[ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]]; then
            log_opts="${{ github.event.before }}..${{ github.sha }}"
          else
            log_opts="HEAD~1..HEAD"
          fi
          bash .github/scripts/security-scan.sh --history "$log_opts"
      - name: Install
        run: python -m pip install -c constraints.txt -e ".[dev]"
      - name: Guard public boundary
        run: bash .github/scripts/guard_public_local_files.sh
      - name: Dependency policy
        run: python .github/scripts/validate_dependency_policy.py
      - name: Testing/CI contract
        run: python .github/scripts/validate_testing_ci_contract.py
      - name: Lint
        run: ruff check .github/src .github/tests
      - name: Format
        run: ruff format --check .github/src .github/tests .github/scripts
      - name: Test
        run: PYTHONPATH=.github/src pytest -q
      - name: Data contracts
        run: |
          PYTHONPATH=.github/src python .github/scripts/validate_data_contract.py --remote --timeout 10
          PYTHONPATH=.github/src python .github/scripts/validate_dataset_consumption_contract.py
          PYTHONPATH=.github/src python .github/scripts/validate_agent_market_context_resources.py
      - name: Supply-chain audit
        run: bash .github/scripts/supply-chain-audit.sh
      - name: Dependency evidence
        run: |
          python -m pip freeze --all >"${RUNNER_TEMP}/tradecat-dependency-freeze.txt"
          cp constraints.txt "${RUNNER_TEMP}/tradecat-constraints.txt"
      - name: Upload dependency evidence
        uses: actions/upload-artifact@v7
        with:
          name: dependency-evidence-${{ matrix.python-version }}
          path: |
            ${{ runner.temp }}/tradecat-dependency-freeze.txt
            ${{ runner.temp }}/tradecat-constraints.txt
      - name: Shell syntax
        run: |
          bash -n .github/scripts/validate-skill.sh .github/scripts/verify.sh .github/scripts/run-tradecat.sh .github/scripts/agent-smoke.sh
          bash -n .github/scripts/security-scan.sh .github/scripts/bootstrap-dev.sh .github/scripts/supply-chain-audit.sh .github/scripts/install-security-tools.sh
          bash -n .github/scripts/clean-local-runtime.sh .github/scripts/start-auto-paper.sh .github/scripts/monitor-auto-paper.sh .github/scripts/verify-project.sh .github/scripts/guard_public_local_files.sh
      - name: Python script syntax
        run: |
          python -m py_compile \
            .github/scripts/request.py \
            .github/scripts/ops-audit.py \
            .github/scripts/serve-auto-paper-monitor.py \
            .github/scripts/validate_dependency_policy.py \
            .github/scripts/validate_testing_ci_contract.py \
            .github/scripts/validate_data_contract.py \
            .github/scripts/validate_dataset_consumption_contract.py \
            .github/scripts/validate_agent_market_context_resources.py
      - name: Wheel package data
        shell: bash
        run: |
          python -m pip wheel . --no-deps -w /tmp/tradecat-wheel
          python - <<'PY'
          from pathlib import Path
          import zipfile

          wheel = next(Path("/tmp/tradecat-wheel").glob("*.whl"))
          with zipfile.ZipFile(wheel) as zf:
              names = set(zf.namelist())
          required = {
              "tradecat_sources/dataset_consumption_contract.json",
              "tradecat_sources/dataset_registry.json",
              "tradecat_sources/dataset_contract.py",
              "tradecat_sources/registry.py",
              "tradecat_sources/sheets.py",
              "tradecat_auto/agent_market_context.py",
              "tradecat_auto/agent_trade_thesis.py",
              "tradecat_auto/cli.py",
              "tradecat_auto/paper_ledger.py",
              "tradecat_auto/pipeline.py",
              "tradecat_auto/production_control.py",
              "tradecat_auto/safety_boundary.py",
              "tradecat_auto/service.py",
          }
          missing = sorted(required - names)
          if missing:
              raise SystemExit(f"missing package data: {missing}")
          PY

  agent-readiness:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install -c constraints.txt -e ".[dev]"
      - name: Agent readiness smoke
        run: bash .github/scripts/agent-smoke.sh
      - name: Upload agent smoke evidence
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: agent-readiness-${{ github.run_id }}
          include-hidden-files: true
          path: |
            .github/skills/tradecat-public/agents/manifest.json
            .github/skills/tradecat-public/references/agent-contract.md
